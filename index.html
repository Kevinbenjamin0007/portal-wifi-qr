<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>WiFi Premium | Autenticación QR + Control Total</title>
    <!-- Html5-QRCode Library -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            max-width: 550px;
            width: 100%;
            overflow: hidden;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .content {
            padding: 24px;
        }

        /* Sistema de Alertas Mejorado */
        .alert-system {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 480px;
            pointer-events: none;
        }

        .alert-toast {
            background: white;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .alert-toast:hover {
            transform: scale(1.02);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            to {
                transform: translateX(100px);
                opacity: 0;
            }
        }

        .alert-toast.success {
            border-left: 5px solid #28a745;
            background: linear-gradient(135deg, #f0fff4, #e8f5e9);
        }
        .alert-toast.error {
            border-left: 5px solid #dc3545;
            background: linear-gradient(135deg, #fff5f5, #fce4e4);
        }
        .alert-toast.warning {
            border-left: 5px solid #ffc107;
            background: linear-gradient(135deg, #fffbef, #fff8e1);
        }
        .alert-toast.info {
            border-left: 5px solid #17a2b8;
            background: linear-gradient(135deg, #e8f7f9, #e0f2f5);
        }

        .alert-icon {
            font-size: 24px;
        }
        .alert-content {
            flex: 1;
        }
        .alert-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 3px;
        }
        .alert-message {
            font-size: 12px;
            color: #555;
        }
        .alert-close {
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 0 5px;
            transition: color 0.2s;
        }
        .alert-close:hover {
            color: #333;
        }

        .info-card {
            background: linear-gradient(135deg, #f0f7ff, #e8f0fe);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(52,152,219,0.2);
        }

        .info-card p {
            color: #2c3e50;
            font-size: 14px;
        }

        .scanner-area {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
            min-height: 320px;
        }

        #qr-reader {
            width: 100%;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 12px rgba(52,152,219,0.3);
        }
        .btn-primary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #7f8c8d;
        }
        .btn-outline {
            background: white;
            color: #3498db;
            border: 2px solid #3498db;
        }
        .btn-outline:hover {
            background: #3498db;
            color: white;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-indicator {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator.active {
            background: #d4edda;
            color: #155724;
        }

        .manual-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        .manual-toggle {
            text-align: center;
        }
        .manual-toggle a {
            color: #3498db;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .manual-form {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            margin-top: 12px;
            display: none;
        }
        .manual-form.show {
            display: block;
            animation: fadeScale 0.2s ease;
        }
        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .manual-form input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            margin-bottom: 10px;
            font-size: 14px;
            transition: border 0.2s;
        }
        .manual-form input:focus {
            outline: none;
            border-color: #3498db;
        }

        .test-panel {
            background: #f0f0f0;
            border-radius: 16px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
        }
        .test-panel h4 {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
        .test-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-test {
            background: #9b59b6;
            color: white;
            padding: 6px 12px;
            font-size: 11px;
            flex: none;
        }
        .btn-test:hover {
            background: #7d3c98;
            transform: translateY(-1px);
        }

        .footer {
            background: #f8f9fa;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="alert-system" id="alertSystem"></div>

<div class="card">
    <div class="header">
        <h1>
            <span>📶</span> WiFi Premium
        </h1>
        <p>Autenticación Inteligente por QR | GWN7630LR & MikroTik</p>
    </div>

    <div class="content">
        <div class="info-card">
            <p id="mainMessage">📱 Escanea el código QR de tu ticket para conectarte a Internet</p>
        </div>

        <div class="scanner-area">
            <div id="qr-reader"></div>
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn-primary">📷 Iniciar Escáner</button>
            <button id="stopBtn" class="btn-secondary" disabled>⏹️ Detener</button>
        </div>

        <div id="statusIndicator" class="status-indicator">
            <span>⚪</span> Sistema listo
        </div>

        <div class="manual-section">
            <div class="manual-toggle">
                <a id="toggleManualBtn">✏️ ¿Problemas con la cámara? Ingreso manual</a>
            </div>
            <div id="manualForm" class="manual-form">
                <input type="text" id="manualUser" placeholder="Usuario del voucher" autocomplete="off">
                <input type="password" id="manualPass" placeholder="Contraseña del voucher">
                <button id="submitManualBtn" class="btn-outline" style="width: 100%;">✅ Conectarse</button>
            </div>
        </div>

        <!-- Panel de pruebas oculto por defecto, se activa con doble click -->
        <div id="testPanel" class="test-panel" style="display: none;">
            <h4>🔧 Panel de Pruebas (Depuración)</h4>
            <div class="test-buttons">
                <button id="testSuccessBtn" class="btn-test">✅ Probar Éxito</button>
                <button id="testErrorBtn" class="btn-test">❌ Probar Error</button>
                <button id="testQRBtn" class="btn-test">📱 Simular QR</button>
            </div>
        </div>
    </div>

    <div class="footer">
        🔒 Sistema con control de errores | Soporte inmediato
    </div>
</div>

<script>
    // ==================== 1. SISTEMA DE ALERTAS MEJORADO ====================
    function showAlert(title, message, type = 'info', duration = 4000) {
        const alertSystem = document.getElementById('alertSystem');
        const alertId = 'alert_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        
        const icons = {
            success: '✅',
            error: '❌',
            warning: '⚠️',
            info: 'ℹ️'
        };
        
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert-toast ${type}`;
        alertDiv.id = alertId;
        alertDiv.innerHTML = `
            <div class="alert-icon">${icons[type] || '📢'}</div>
            <div class="alert-content">
                <div class="alert-title">${escapeHtml(title)}</div>
                <div class="alert-message">${escapeHtml(message)}</div>
            </div>
            <div class="alert-close" onclick="document.getElementById('${alertId}').remove()">✕</div>
        `;
        
        alertSystem.appendChild(alertDiv);
        
        // Auto-cerrar
        setTimeout(() => {
            const el = document.getElementById(alertId);
            if (el) {
                el.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => {
                    if (el && el.parentNode) el.remove();
                }, 300);
            }
        }, duration);
        
        console.log(`[${type.toUpperCase()}] ${title}: ${message}`);
        return alertId;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function updateStatus(status, message) {
        const indicator = document.getElementById('statusIndicator');
        const icons = {
            idle: '⚪',
            loading: '🔄',
            success: '✅',
            error: '❌',
            scanning: '📷'
        };
        indicator.innerHTML = `<span>${icons[status] || '⚪'}</span> ${message}`;
        indicator.className = `status-indicator ${status === 'scanning' || status === 'loading' ? 'active' : ''}`;
    }

    // ==================== 2. CAPTURAR VARIABLES DEL AP GRANDSTREAM ====================
    const urlParams = new URLSearchParams(window.location.search);
    const ap_url = urlParams.get('base_grant_url');
    const ap_token = urlParams.get('grant_token');

    // Guardar en localStorage
    if (ap_url && ap_token) {
        localStorage.setItem('ap_wifi_url', ap_url);
        localStorage.setItem('ap_wifi_token', ap_token);
        showAlert('✅ Configuración guardada', 'Red WiFi detectada correctamente', 'success', 3000);
        updateStatus('idle', 'Red detectada - Listo para escanear');
    } else {
        showAlert('⚠️ Sin red detectada', 'Conéctate al WiFi del local primero', 'warning', 5000);
        updateStatus('idle', 'Conecta a la red WiFi primero');
    }

    // Autenticación por URL directa (u y p)
    const urlUser = urlParams.get('u');
    const urlPass = urlParams.get('p');
    if (urlUser && urlPass) {
        showAlert('🔑 Voucher detectado', `Usuario: ${urlUser}`, 'info', 3000);
        updateStatus('loading', 'Procesando autenticación...');
        setTimeout(() => authenticateVoucher(urlUser, urlPass), 1000);
    }

    // ==================== 3. FUNCIÓN PRINCIPAL DE AUTENTICACIÓN ====================
    function authenticateVoucher(username, password) {
        const savedUrl = localStorage.getItem('ap_wifi_url');
        const savedToken = localStorage.getItem('ap_wifi_token');

        if (!savedUrl || !savedToken) {
            showAlert('❌ Error de conexión', 'No estás conectado a la red WiFi del local', 'error', 5000);
            updateStatus('error', 'Error: Conéctate al WiFi');
            return false;
        }

        showAlert('🔄 Autenticando', `Validando voucher para ${username}...`, 'info', 2000);
        updateStatus('loading', `Autenticando como ${username}...`);

        // Construir URL de redirección
        let redirectUrl;
        if (savedUrl.includes('?')) {
            redirectUrl = `${savedUrl}&token=${encodeURIComponent(savedToken)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        } else {
            redirectUrl = `${savedUrl}?token=${encodeURIComponent(savedToken)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        }

        setTimeout(() => {
            showAlert('✅ Redirigiendo', 'Autenticación exitosa, conectando a Internet...', 'success', 2000);
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 500);
        }, 500);

        return true;
    }

    // ==================== 4. FUNCIÓN PARA PROCESAR QR (MEJORADA) ====================
    let lastScannedData = null;

    function onScanSuccess(decodedText) {
        lastScannedData = decodedText;
        
        // Alerta inmediata de QR detectado
        showAlert('📱 QR Detectado', `Código: ${decodedText.substring(0, 60)}${decodedText.length > 60 ? '...' : ''}`, 'info', 4000);
        updateStatus('loading', 'Procesando código QR...');
        
        // Detener escáner automáticamente
        if (html5QrCode && isScanning) {
            stopScanner();
        }
        
        let username = null;
        let password = null;
        let parseMethod = '';
        
        try {
            // Método 1: URL con parámetros (formato: https://ejemplo.com?u=usuario&p=password)
            if (decodedText.includes('?')) {
                const qrParams = new URLSearchParams(decodedText.split('?')[1]);
                username = qrParams.get('u');
                password = qrParams.get('p');
                parseMethod = 'URL';
            }
            
            // Método 2: Solo parámetros (u=usuario&p=password)
            if ((!username || !password) && decodedText.includes('&') && decodedText.includes('=')) {
                const qrParams = new URLSearchParams(decodedText);
                username = qrParams.get('u');
                password = qrParams.get('p');
                parseMethod = 'Parámetros directos';
            }
            
            // Método 3: Formato "usuario:contraseña"
            if (!username && decodedText.includes(':')) {
                const parts = decodedText.split(':');
                username = parts[0];
                password = parts[1];
                parseMethod = 'Formato ":"';
            }
            
            // Método 4: Formato "usuario,contraseña"
            if (!username && decodedText.includes(',')) {
                const parts = decodedText.split(',');
                username = parts[0];
                password = parts[1];
                parseMethod = 'Formato ","';
            }
            
            const savedUrl = localStorage.getItem('ap_wifi_url');
            
            if (username && password && savedUrl) {
                showAlert('✅ QR Válido', `Parseado como ${parseMethod} | Usuario: ${username}`, 'success', 4000);
                updateStatus('success', `QR válido - Usuario: ${username}`);
                authenticateVoucher(username, password);
            } else if (!savedUrl) {
                showAlert('❌ Error de red', 'No estás conectado al WiFi del local', 'error', 5000);
                updateStatus('error', 'Error: Conéctate al WiFi');
            } else {
                showAlert('❌ QR Inválido', 'El código no contiene usuario/contraseña válidos', 'error', 5000);
                updateStatus('error', 'QR inválido - Usa modo manual');
                console.error('Contenido del QR:', decodedText);
            }
            
        } catch (e) {
            showAlert('❌ Error al parsear QR', e.message, 'error', 5000);
            updateStatus('error', 'Error al procesar QR');
            console.error('Error de parseo:', e);
        }
    }

    // ==================== 5. ESCÁNER QR CON CONTROL DE ERRORES ====================
    let html5QrCode = null;
    let isScanning = false;

    async function startScanner() {
        if (isScanning) {
            showAlert('⚠️ Escáner activo', 'Ya hay un escáner funcionando', 'warning', 2000);
            return;
        }

        try {
            showAlert('📷 Iniciando cámara', 'Solicitando permiso...', 'info', 2000);
            updateStatus('loading', 'Iniciando cámara...');
            
            html5QrCode = new Html5Qrcode("qr-reader");
            const cameras = await Html5Qrcode.getCameras();
            
            if (!cameras || cameras.length === 0) {
                throw new Error('No se encontraron cámaras');
            }
            
            showAlert('📸 Cámara lista', `Se detectaron ${cameras.length} cámara(s)`, 'success', 2000);
            
            // Seleccionar cámara trasera si existe
            let selectedCamera = cameras[0];
            for (const cam of cameras) {
                if (cam.label.toLowerCase().includes('back') || 
                    cam.label.toLowerCase().includes('environment') ||
                    cam.label.toLowerCase().includes('trasera')) {
                    selectedCamera = cam;
                    break;
                }
            }
            
            const config = {
                fps: 10,
                qrbox: { width: 280, height: 280 },
                aspectRatio: 1.0
            };
            
            await html5QrCode.start(
                { deviceId: selectedCamera.id },
                config,
                onScanSuccess,
                (error) => {
                    // Ignorar errores de "no QR found" - solo mostrar errores críticos
                    if (error && (error.includes('Permission') || error.includes('NotAllowed'))) {
                        showAlert('🔒 Permiso denegado', 'No se pudo acceder a la cámara', 'error', 4000);
                        stopScanner();
                    }
                }
            );
            
            isScanning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            updateStatus('scanning', 'Escáner activo - Apunta al QR');
            showAlert('✅ Escáner listo', 'Apunta al código QR de tu ticket', 'success', 3000);
            
        } catch (err) {
            showAlert('❌ Error de cámara', err.message, 'error', 5000);
            updateStatus('error', 'Error: No se pudo acceder a la cámara');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    }

    async function stopScanner() {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
                isScanning = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                updateStatus('idle', 'Escáner detenido');
                showAlert('⏹️ Escáner detenido', 'Puedes reiniciarlo cuando quieras', 'info', 2000);
            } catch (err) {
                console.error('Error al detener:', err);
            }
        }
    }

    // ==================== 6. MODO MANUAL ====================
    function toggleManualMode() {
        const manualForm = document.getElementById('manualForm');
        manualForm.classList.toggle('show');
        if (manualForm.classList.contains('show')) {
            document.getElementById('manualUser').focus();
        }
    }

    function submitManualVoucher() {
        const username = document.getElementById('manualUser').value.trim();
        const password = document.getElementById('manualPass').value.trim();
        
        if (!username || !password) {
            showAlert('⚠️ Datos incompletos', 'Ingresa usuario y contraseña', 'warning', 3000);
            return;
        }
        
        showAlert('🔑 Voucher manual', `Usuario: ${username}`, 'info', 2000);
        authenticateVoucher(username, password);
    }

    // ==================== 7. PANEL DE PRUEBAS (DOBLE CLICK PARA ACTIVAR) ====================
    let testPanelVisible = false;
    const card = document.querySelector('.card');
    card.addEventListener('dblclick', () => {
        const testPanel = document.getElementById('testPanel');
        testPanelVisible = !testPanelVisible;
        testPanel.style.display = testPanelVisible ? 'block' : 'none';
        if (testPanelVisible) {
            showAlert('🧪 Panel de pruebas', 'Modo depuración activado', 'info', 2000);
        }
    });

    function testSuccessAlert() {
        showAlert('✅ Prueba Exitosa', 'El sistema de alertas funciona correctamente', 'success', 3000);
    }
    
    function testErrorAlert() {
        showAlert('❌ Prueba de Error', 'Este es un mensaje de error de prueba', 'error', 3000);
    }
    
    function testQRSimulation() {
        const testQR = "u=test_usuario&p=test_password123";
        showAlert('🧪 Simulación QR', `QR de prueba: ${testQR}`, 'info', 3000);
        setTimeout(() => {
            onScanSuccess(testQR);
        }, 500);
    }

    // ==================== 8. EVENT LISTENERS ====================
    document.getElementById('startBtn').addEventListener('click', startScanner);
    document.getElementById('stopBtn').addEventListener('click', stopScanner);
    document.getElementById('toggleManualBtn').addEventListener('click', toggleManualMode);
    document.getElementById('submitManualBtn').addEventListener('click', submitManualVoucher);
    
    document.getElementById('manualUser').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('manualPass').focus();
    });
    document.getElementById('manualPass').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitManualVoucher();
    });
    
    // Botones de prueba (solo visibles en modo depuración)
    if (document.getElementById('testSuccessBtn')) {
        document.getElementById('testSuccessBtn').addEventListener('click', testSuccessAlert);
        document.getElementById('testErrorBtn').addEventListener('click', testErrorAlert);
        document.getElementById('testQRBtn').addEventListener('click', testQRSimulation);
    }

    // ==================== 9. LIMPIEZA AL SALIR ====================
    window.addEventListener('beforeunload', async () => {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
            } catch(e) {}
        }
    });

    // Mensaje de inicio
    showAlert('🚀 Sistema listo', 'Usa "Iniciar Escáner" para comenzar', 'success', 4000);
    updateStatus('idle', 'Listo - Inicia el escáner');
    console.log('✅ Sistema de autenticación QR cargado correctamente');
</script>
</body>
</html>
