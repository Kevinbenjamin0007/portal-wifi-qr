<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>WiFi Premium | Autenticación QR + Control de Errores</title>
    <!-- Html5-QRCode Library -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            max-width: 550px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .content {
            padding: 24px;
        }

        /* Sistema de Alertas - Control total */
        .alert-system {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 500px;
            pointer-events: none;
        }

        .alert-toast {
            background: white;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            pointer-events: auto;
            cursor: pointer;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            to {
                transform: translateX(100px);
                opacity: 0;
            }
        }

        .alert-toast.success {
            border-left: 5px solid #28a745;
            background: #f0fff4;
        }
        .alert-toast.error {
            border-left: 5px solid #dc3545;
            background: #fff5f5;
        }
        .alert-toast.warning {
            border-left: 5px solid #ffc107;
            background: #fffbef;
        }
        .alert-toast.info {
            border-left: 5px solid #17a2b8;
            background: #e8f7f9;
        }
        .alert-toast.test {
            border-left: 5px solid #9b59b6;
            background: #f3e8ff;
        }

        .alert-icon {
            font-size: 24px;
        }
        .alert-content {
            flex: 1;
        }
        .alert-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 3px;
        }
        .alert-message {
            font-size: 12px;
            color: #555;
        }
        .alert-close {
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 0 5px;
        }

        .info-card {
            background: #f0f7ff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .scanner-area {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        #qr-reader {
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #95a5a6;
            color: white;
        }
        .btn-outline {
            background: white;
            color: #3498db;
            border: 2px solid #3498db;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .test-section {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }
        .test-section h4 {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .test-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-test {
            background: #9b59b6;
            color: white;
            padding: 8px 15px;
            font-size: 12px;
        }
        .btn-test:hover {
            background: #7d3c98;
        }

        .manual-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        .manual-toggle {
            text-align: center;
        }
        .manual-toggle a {
            color: #3498db;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }
        .manual-form {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            margin-top: 12px;
            display: none;
        }
        .manual-form.show {
            display: block;
        }
        .manual-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 50px;
            margin-bottom: 10px;
        }

        .footer {
            background: #f8f9fa;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="alert-system" id="alertSystem"></div>

<div class="card">
    <div class="header">
        <h1>
            <span>📶</span> WiFi Premium
        </h1>
        <p style="font-size: 12px; margin-top: 5px;">Autenticación por QR con control de errores</p>
    </div>

    <div class="content">
        <div class="info-card">
            <p id="mainMessage">📱 Escanea el código QR de tu ticket para conectarte</p>
        </div>

        <div class="scanner-area">
            <div id="qr-reader"></div>
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn-primary">📷 Iniciar Escáner</button>
            <button id="stopBtn" class="btn-secondary" disabled>⏹️ Detener</button>
        </div>

        <!-- Panel de pruebas para verificar el sistema de alertas -->
        <div class="test-section">
            <h4>🔧 Panel de Pruebas (Verificar Alertas)</h4>
            <div class="test-buttons">
                <button id="testSuccessBtn" class="btn-test">✅ Probar Éxito</button>
                <button id="testErrorBtn" class="btn-test">❌ Probar Error</button>
                <button id="testWarningBtn" class="btn-test">⚠️ Probar Advertencia</button>
                <button id="testQRBtn" class="btn-test">📱 Simular QR Válido</button>
            </div>
        </div>

        <div class="manual-section">
            <div class="manual-toggle">
                <a id="toggleManualBtn">✏️ ¿No funciona la cámara? Acceso manual</a>
            </div>
            <div id="manualForm" class="manual-form">
                <input type="text" id="manualUser" placeholder="Usuario del voucher">
                <input type="password" id="manualPass" placeholder="Contraseña">
                <button id="submitManualBtn" class="btn-outline" style="width: 100%;">Conectarse</button>
            </div>
        </div>
    </div>

    <div class="footer">
        🔒 Sistema con control de errores · Soporte inmediato
    </div>
</div>

<script>
    // ==================== SISTEMA DE ALERTAS VISUALES ====================
    let alertTimeout = null;
    let activeAlerts = [];

    function showAlert(title, message, type = 'info', duration = 4000) {
        const alertSystem = document.getElementById('alertSystem');
        const alertId = 'alert_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        
        const icons = {
            success: '✅',
            error: '❌',
            warning: '⚠️',
            info: 'ℹ️',
            test: '🧪'
        };
        
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert-toast ${type}`;
        alertDiv.id = alertId;
        alertDiv.innerHTML = `
            <div class="alert-icon">${icons[type] || '📢'}</div>
            <div class="alert-content">
                <div class="alert-title">${title}</div>
                <div class="alert-message">${message}</div>
            </div>
            <div class="alert-close" onclick="document.getElementById('${alertId}').remove()">✕</div>
        `;
        
        alertSystem.appendChild(alertDiv);
        activeAlerts.push(alertId);
        
        // Auto-cerrar después de duración
        setTimeout(() => {
            const el = document.getElementById(alertId);
            if (el) {
                el.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => {
                    if (el && el.parentNode) el.remove();
                    activeAlerts = activeAlerts.filter(id => id !== alertId);
                }, 300);
            }
        }, duration);
        
        // Log a consola
        console.log(`[ALERTA ${type.toUpperCase()}] ${title}: ${message}`);
        return alertId;
    }

    // ==================== VARIABLES GLOBALES ====================
    let html5QrScanner = null;
    let isScanning = false;
    let lastScannedData = null;

    // Elementos DOM
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const toggleManualBtn = document.getElementById('toggleManualBtn');
    const manualForm = document.getElementById('manualForm');
    const manualUser = document.getElementById('manualUser');
    const manualPass = document.getElementById('manualPass');
    const submitManualBtn = document.getElementById('submitManualBtn');
    const mainMessage = document.getElementById('mainMessage');

    // ==================== PARÁMETROS URL ====================
    const urlParams = new URLSearchParams(window.location.search);
    const apBaseUrl = urlParams.get('base_grant_url');
    const apGrantToken = urlParams.get('grant_token');

    if (apBaseUrl && apGrantToken) {
        localStorage.setItem('ap_wifi_url', apBaseUrl);
        localStorage.setItem('ap_wifi_token', apGrantToken);
        showAlert('✅ Configuración guardada', 'Red WiFi detectada correctamente', 'success', 3000);
    } else {
        showAlert('⚠️ Sin red detectada', 'Conéctate al WiFi del local primero', 'warning', 4000);
    }

    // Auto-autenticación por URL
    const urlUser = urlParams.get('u');
    const urlPass = urlParams.get('p');
    if (urlUser && urlPass) {
        showAlert('🔑 Voucher detectado', `Usuario: ${urlUser}`, 'info', 3000);
        setTimeout(() => authenticateVoucher(urlUser, urlPass), 1000);
    }

    // ==================== FUNCIÓN DE AUTENTICACIÓN ====================
    function authenticateVoucher(username, password) {
        const savedUrl = localStorage.getItem('ap_wifi_url');
        const savedToken = localStorage.getItem('ap_wifi_token');

        if (!savedUrl || !savedToken) {
            showAlert('❌ Error de conexión', 'No estás conectado a la red WiFi del local', 'error', 5000);
            mainMessage.innerHTML = '⚠️ Conéctate a la red WiFi primero';
            return false;
        }

        showAlert('🔄 Autenticando', `Validando voucher para ${username}...`, 'info', 2000);
        mainMessage.innerHTML = '⏳ Conectando con el servidor...';

        let redirectUrl;
        if (savedUrl.includes('?')) {
            redirectUrl = `${savedUrl}&token=${encodeURIComponent(savedToken)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        } else {
            redirectUrl = `${savedUrl}?token=${encodeURIComponent(savedToken)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        }

        setTimeout(() => {
            showAlert('✅ Redirigiendo', 'Autenticación exitosa, conectando...', 'success', 2000);
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 500);
        }, 500);

        return true;
    }

    // ==================== ESCÁNER QR CON CONTROL DE ERRORES ====================
    async function startScanner() {
        if (isScanning) {
            showAlert('⚠️ Escáner activo', 'Ya hay un escáner en funcionamiento', 'warning', 2000);
            return;
        }

        try {
            showAlert('📷 Iniciando cámara', 'Solicitando permiso para acceder a la cámara...', 'info', 2000);
            
            html5QrScanner = new Html5Qrcode("qr-reader");
            const cameras = await Html5Qrcode.getCameras();
            
            if (!cameras || cameras.length === 0) {
                throw new Error('No se encontraron cámaras en este dispositivo');
            }
            
            showAlert('📸 Cámara encontrada', `Se detectaron ${cameras.length} cámara(s)`, 'success', 2000);
            
            let selectedCamera = cameras[0];
            for (const cam of cameras) {
                if (cam.label.toLowerCase().includes('back') || cam.label.toLowerCase().includes('environment')) {
                    selectedCamera = cam;
                    break;
                }
            }
            
            const config = { fps: 10, qrbox: { width: 280, height: 280 } };
            await html5QrScanner.start(selectedCamera.id, config, onQRSuccess, onQRError);
            
            isScanning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            showAlert('✅ Escáner listo', 'Apunta al código QR de tu ticket', 'success', 3000);
            mainMessage.innerHTML = '🎯 Escáner activo - Enfoca el código QR';
            
        } catch (err) {
            showAlert('❌ Error de cámara', err.message, 'error', 5000);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            mainMessage.innerHTML = '⚠️ Usa el modo manual para conectarte';
        }
    }

    async function stopScanner() {
        if (html5QrScanner && isScanning) {
            try {
                await html5QrScanner.stop();
                isScanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                showAlert('⏹️ Escáner detenido', 'Puedes reiniciarlo cuando quieras', 'info', 2000);
            } catch (err) {
                showAlert('⚠️ Error al detener', err.message, 'warning', 2000);
            }
        }
    }

    // Control de QR escaneado - CON ALERTA VISUAL
    function onQRSuccess(decodedText, decodedResult) {
        lastScannedData = decodedText;
        
        // ALERTA INMEDIATA: QR DETECTADO
        showAlert('📱 QR Detectado', `Código: ${decodedText.substring(0, 50)}${decodedText.length > 50 ? '...' : ''}`, 'test', 4000);
        
        stopScanner();
        
        let username = null;
        let password = null;
        let parseMethod = '';
        
        try {
            // Método 1: URL con parámetros
            if (decodedText.includes('?')) {
                const urlObj = new URL(decodedText);
                username = urlObj.searchParams.get('u');
                password = urlObj.searchParams.get('p');
                parseMethod = 'URL';
            }
            
            // Método 2: Query string directo
            if ((!username || !password) && decodedText.includes('&')) {
                const params = new URLSearchParams(decodedText);
                username = params.get('u');
                password = params.get('p');
                parseMethod = 'Query String';
            }
            
            // Método 3: Formato "usuario:contraseña"
            if (!username && decodedText.includes(':')) {
                const parts = decodedText.split(':');
                username = parts[0];
                password = parts[1];
                parseMethod = 'Formato ":"';
            }
            
            // Método 4: Formato "usuario,contraseña"
            if (!username && decodedText.includes(',')) {
                const parts = decodedText.split(',');
                username = parts[0];
                password = parts[1];
                parseMethod = 'Formato ","';
            }
            
            if (username && password) {
                // ALERTA DE ÉXITO: QR VÁLIDO
                showAlert('✅ QR Válido', `Parseado como ${parseMethod} | Usuario: ${username}`, 'success', 5000);
                mainMessage.innerHTML = `✅ QR válido - Conectando como ${username}...`;
                authenticateVoucher(username, password);
            } else {
                // ALERTA DE ERROR: QR INVÁLIDO
                showAlert('❌ QR Inválido', 'El código escaneado no contiene usuario/contraseña válidos', 'error', 5000);
                mainMessage.innerHTML = '❌ QR inválido - Usa el modo manual';
                
                // Mostrar contenido en consola para depuración
                console.error('Contenido del QR inválido:', decodedText);
                console.error('Intentos de parseo fallidos');
            }
            
        } catch (e) {
            showAlert('❌ Error al parsear QR', e.message, 'error', 5000);
            console.error('Error de parseo:', e);
        }
    }

    function onQRError(errorMessage) {
        // Solo mostrar errores críticos, no saturar con "no se encontró QR"
        if (errorMessage && (errorMessage.includes('Permission') || errorMessage.includes('NotAllowed'))) {
            showAlert('🔒 Permiso denegado', 'No se pudo acceder a la cámara', 'error', 4000);
            stopScanner();
        }
    }

    // ==================== MODO MANUAL ====================
    function toggleManualMode() {
        manualForm.classList.toggle('show');
        if (manualForm.classList.contains('show')) {
            showAlert('✏️ Modo manual', 'Ingresa usuario y contraseña del voucher', 'info', 3000);
        }
    }

    function submitManual() {
        const user = manualUser.value.trim();
        const pass = manualPass.value.trim();
        
        if (!user || !pass) {
            showAlert('⚠️ Datos incompletos', 'Ingresa usuario y contraseña', 'warning', 3000);
            return;
        }
        
        showAlert('🔑 Voucher manual', `Usuario: ${user}`, 'info', 3000);
        authenticateVoucher(user, pass);
    }

    // ==================== PANEL DE PRUEBAS ====================
    function testSuccessAlert() {
        showAlert('✅ Prueba Exitosa', 'El sistema de alertas funciona correctamente', 'success', 3000);
    }
    
    function testErrorAlert() {
        showAlert('❌ Prueba de Error', 'Este es un mensaje de error de prueba', 'error', 3000);
    }
    
    function testWarningAlert() {
        showAlert('⚠️ Prueba de Advertencia', 'Este es un mensaje de advertencia de prueba', 'warning', 3000);
    }
    
    function testQRSimulation() {
        const testQR = "u=test_usuario&p=test_password123";
        showAlert('🧪 Simulación QR', `QR de prueba: ${testQR}`, 'test', 4000);
        setTimeout(() => {
            onQRSuccess(testQR, null);
        }, 500);
    }

    // ==================== EVENT LISTENERS ====================
    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
    toggleManualBtn.addEventListener('click', toggleManualMode);
    submitManualBtn.addEventListener('click', submitManual);
    
    document.getElementById('testSuccessBtn').addEventListener('click', testSuccessAlert);
    document.getElementById('testErrorBtn').addEventListener('click', testErrorAlert);
    document.getElementById('testWarningBtn').addEventListener('click', testWarningAlert);
    document.getElementById('testQRBtn').addEventListener('click', testQRSimulation);
    
    manualUser.addEventListener('keypress', (e) => { if (e.key === 'Enter') manualPass.focus(); });
    manualPass.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitManual(); });

    // Limpieza
    window.addEventListener('beforeunload', async () => {
        if (html5QrScanner && isScanning) {
            try { await html5QrScanner.stop(); } catch(e) {}
        }
    });

    // Mostrar alerta de inicio
    showAlert('🚀 Sistema listo', 'Usa el botón "Iniciar Escáner" para comenzar', 'success', 4000);
    console.log('✅ Sistema de alertas activo - Los mensajes aparecerán en la parte superior');
</script>
</body>
</html>
