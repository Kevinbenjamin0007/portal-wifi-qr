<form method="post" action="http://grandstream.com">
    <!-- El "action" varía según el firmware, este es el estándar -->
    <input type="text" name="username" placeholder="Usuario" required>
    <input type="password" name="password" placeholder="Contraseña" required>
    
    <!-- Campos ocultos necesarios para que el AP sepa a dónde ir después -->
    <input type="hidden" name="dst" value="https://google.com">
    
    <button type="submit">Conectarse</button>
</form>
