<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WiFi Premium | Acceso por QR</title>
    <!-- Html5-QRCode Library CDN correcta -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main card */
        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 28px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 25px 20px;
            text-align: center;
            color: white;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo svg {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 5px;
        }

        /* Content */
        .content {
            padding: 24px;
        }

        .info-card {
            background: #f0f7ff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
        }

        .info-card h3 {
            color: #1a1a2e;
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card p {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        /* QR Scanner */
        .scanner-area {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
            min-height: 300px;
        }

        #qr-reader {
            width: 100%;
            border: none;
        }

        #qr-reader__dashboard_section_csr {
            padding: 10px;
        }

        /* Botones */
        .button-group {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: #0056b3;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #545b62;
        }

        .btn-outline {
            background: white;
            color: #007bff;
            border: 2px solid #007bff;
        }

        .btn-outline:hover {
            background: #007bff;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Estado de carga */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modo manual */
        .manual-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .manual-link {
            text-align: center;
            font-size: 13px;
        }

        .manual-link a {
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
        }

        .manual-panel {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
            display: none;
        }

        .manual-panel.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .manual-panel input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Footer */
        .footer {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #888;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.error {
            background: #dc3545;
        }

        .toast.success {
            background: #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21l-12-18h24z"/>
                <circle cx="12" cy="18" r="2" fill="white"/>
            </svg>
            <span>WiFi Premium</span>
        </div>
        <div class="subtitle">Acceso ultrarrápido | GWN7630LR & MikroTik</div>
    </div>

    <div class="content">
        <div class="info-card">
            <h3>
                <span>📱</span> Paso final
            </h3>
            <p id="infoText">Escanea el código QR que se encuentra en tu mesa o ticket para activar tu conexión a internet.</p>
        </div>

        <!-- Área del escáner QR -->
        <div class="scanner-area">
            <div id="qr-reader"></div>
        </div>

        <!-- Botones de control -->
        <div class="button-group">
            <button class="btn btn-primary" id="startBtn">
                ▶️ Iniciar escáner
            </button>
            <button class="btn btn-secondary" id="stopBtn" disabled>
                ⏹️ Detener
            </button>
        </div>

        <!-- Modo manual de respaldo -->
        <div class="manual-section">
            <div class="manual-link">
                🔍 <a id="showManualBtn">¿No funciona la cámara? Acceso manual aquí</a>
            </div>
            <div class="manual-panel" id="manualPanel">
                <input type="text" id="manualCode" placeholder="Ingresa el código de tu ticket/mesa" autocomplete="off">
                <button class="btn btn-outline" id="submitManualBtn" style="width: 100%;">
                    ✅ Validar acceso
                </button>
            </div>
        </div>
    </div>

    <div class="footer">
        Sistema de autenticación seguro | Escanea el QR para conectarte
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // Variables globales
    let html5QrCode = null;
    let isScanning = false;

    // Elementos DOM
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const showManualBtn = document.getElementById('showManualBtn');
    const manualPanel = document.getElementById('manualPanel');
    const submitManualBtn = document.getElementById('submitManualBtn');
    const manualCodeInput = document.getElementById('manualCode');
    const infoText = document.getElementById('infoText');

    // Obtener parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const grant_url = urlParams.get('base_grant_url');
    const grant_token = urlParams.get('grant_token');

    // Guardar credenciales del AP si existen
    if (grant_url && grant_token) {
        localStorage.setItem('ap_wifi_url', grant_url);
        localStorage.setItem('ap_wifi_token', grant_token);
        console.log('✅ Credenciales del AP guardadas');
    }

    // Función para mostrar mensajes toast
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show';
        if (type === 'error') toast.classList.add('error');
        if (type === 'success') toast.classList.add('success');
        setTimeout(() => {
            toast.classList.remove('show');
            toast.className = 'toast';
        }, 3000);
    }

    // Función para validar y redirigir
    function validateAndConnect(token) {
        const storedUrl = localStorage.getItem('ap_wifi_url');
        const storedToken = localStorage.getItem('ap_wifi_token');
        
        // Priorizar token pasado como parámetro
        const finalToken = token || storedToken;
        const finalUrl = storedUrl;

        if (!finalUrl || !finalToken) {
            showToast('❌ Error: No se detectó la red WiFi. Conéctate a la red del local.', 'error');
            infoText.innerHTML = '⚠️ <strong>Error de conexión:</strong> Asegúrate de estar conectado a la red WiFi del establecimiento antes de escanear.';
            return false;
        }

        // Mostrar estado de validación
        infoText.innerHTML = '🔄 <strong>Validando acceso...</strong> Conectando con el servidor, por favor espera.';
        
        // Construir URL de redirección
        let redirectUrl = `${finalUrl}?token=${encodeURIComponent(finalToken)}&continue=https://www.google.com`;
        
        if (finalUrl.includes('?')) {
            redirectUrl = `${finalUrl}&token=${encodeURIComponent(finalToken)}&continue=https://www.google.com`;
        }

        // Pequeño delay para feedback visual
        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 1500);
        
        return true;
    }

    // Función para iniciar el escáner QR
    async function startScanner() {
        if (isScanning) {
            showToast('El escáner ya está activo', 'info');
            return;
        }

        try {
            // Crear instancia del lector QR
            html5QrCode = new Html5Qrcode("qr-reader");
            
            // Configuración optimizada
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0,
                disableFlip: false
            };

            // Intentar iniciar con cámara trasera (environment)
            const devices = await Html5Qrcode.getCameras();
            
            if (devices && devices.length) {
                let cameraId = devices[0].id;
                // Buscar cámara trasera si existe
                const backCamera = devices.find(device => device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('environment'));
                if (backCamera) {
                    cameraId = backCamera.id;
                }
                
                await html5QrCode.start(cameraId, config, onScanSuccess, onScanError);
                isScanning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                showToast('📷 Escáner activado - Apunta al código QR', 'success');
                infoText.innerHTML = '📸 <strong>Escáner activo:</strong> Enfoca el código QR que está en tu mesa o ticket.';
            } else {
                throw new Error('No se encontraron cámaras');
            }
        } catch (err) {
            console.error('Error al iniciar escáner:', err);
            showToast('❌ No se pudo acceder a la cámara. Usa el acceso manual.', 'error');
            infoText.innerHTML = '⚠️ <strong>No se detectó cámara:</strong> Usa el enlace "Acceso manual" para ingresar tu código.';
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
    }

    // Función para detener el escáner
    async function stopScanner() {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
                isScanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                showToast('⏹️ Escáner detenido', 'info');
                infoText.innerHTML = '📱 Escanea el código QR que se encuentra en tu mesa o ticket para activar tu conexión.';
            } catch (err) {
                console.error('Error al detener:', err);
            }
        }
    }

    // Callback cuando se escanea un QR exitosamente
    function onScanSuccess(decodedText, decodedResult) {
        console.log('✅ QR escaneado:', decodedText);
        
        // Detener el escáner automáticamente
        stopScanner();
        
        // Mostrar mensaje de éxito
        showToast('✅ Código QR detectado. Validando acceso...', 'success');
        
        // Validar el código escaneado
        validateAndConnect(decodedText);
    }

    // Callback para errores de escaneo (se ignoran para no molestar)
    function onScanError(errorMessage) {
        // Los errores menores (como frames sin QR) se ignoran
        // Solo mostramos si es un error grave
        if (errorMessage.includes('Permission') || errorMessage.includes('NotAllowedError')) {
            showToast('🔒 Permiso de cámara denegado. Usa el acceso manual.', 'error');
            stopScanner();
        }
    }

    // Mostrar panel manual
    function showManualPanel() {
        manualPanel.classList.toggle('show');
        if (manualPanel.classList.contains('show')) {
            manualCodeInput.focus();
            if (isScanning) {
                stopScanner();
            }
        }
    }

    // Enviar código manual
    function submitManualCode() {
        const code = manualCodeInput.value.trim();
        if (!code) {
            showToast('✏️ Por favor, ingresa el código que ves en tu ticket o mesa', 'error');
            return;
        }
        
        showToast('🔍 Validando código manual...', 'info');
        validateAndConnect(code);
    }

    // Event listeners
    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
    showManualBtn.addEventListener('click', showManualPanel);
    submitManualBtn.addEventListener('click', submitManualCode);
    
    // Enter en el input manual
    manualCodeInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            submitManualCode();
        }
    });

    // Verificar si hay validación automática por URL
    if (urlParams.get('validar') === 'true') {
        const savedToken = localStorage.getItem('ap_wifi_token');
        const savedUrl = localStorage.getItem('ap_wifi_url');
        if (savedToken && savedUrl) {
            infoText.innerHTML = '🔄 <strong>Validación automática...</strong> Conectando...';
            setTimeout(() => {
                validateAndConnect(savedToken);
            }, 500);
        }
    }

    // Limpiar al salir
    window.addEventListener('beforeunload', () => {
        if (html5QrCode && isScanning) {
            html5QrCode.stop().catch(console.log);
        }
    });

    console.log('✅ App lista - Haz clic en "Iniciar escáner" para comenzar');
</script>
</body>
</html>
