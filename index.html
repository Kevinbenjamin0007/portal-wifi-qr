<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>WiFi Premium | Autenticación Inteligente QR</title>
    <!-- Html5-QRCode Library - Versión estable verificada -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Debug panel - solo visible en desarrollo, oculto por defecto */
        .debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-family: monospace;
            font-size: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 9999;
            max-width: 90%;
            overflow-x: auto;
            white-space: pre-wrap;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .debug-panel:hover {
            opacity: 1;
        }
        .debug-panel.collapsed {
            width: 30px;
            height: 30px;
            overflow: hidden;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .debug-panel.collapsed span {
            display: none;
        }
        .debug-panel.collapsed::before {
            content: "🐛";
            font-size: 18px;
        }

        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            max-width: 550px;
            width: 100%;
            overflow: hidden;
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 28px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .badge-wifi {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 4px 12px;
            font-size: 11px;
            margin-top: 10px;
        }

        .content {
            padding: 24px;
        }

        .info-card {
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f7ff 100%);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(52,152,219,0.2);
        }

        .info-card p {
            color: #2c3e50;
            line-height: 1.5;
            font-size: 14px;
        }

        .info-card .highlight {
            color: #3498db;
            font-weight: 600;
        }

        .scanner-area {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin: 16px 0;
            position: relative;
            min-height: 320px;
        }

        #qr-reader {
            width: 100%;
            border: none;
        }

        /* Estilos internos del escáner */
        #qr-reader video {
            width: 100% !important;
            height: auto !important;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin: 20px 0 16px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 12px rgba(52,152,219,0.35);
        }

        .btn-primary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(52,152,219,0.45);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c0392b;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #7f8c8d;
        }

        .btn-outline {
            background: white;
            color: #3498db;
            border: 2px solid #3498db;
        }

        .btn-outline:hover {
            background: #3498db;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-area {
            margin: 15px 0;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .loader-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .manual-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e9ecef;
        }

        .manual-toggle {
            text-align: center;
            margin-bottom: 12px;
        }

        .manual-toggle a {
            color: #3498db;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .manual-form {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 18px;
            display: none;
            animation: fadeScale 0.2s ease;
        }

        .manual-form.show {
            display: block;
        }

        @keyframes fadeScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .manual-form input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 14px;
            margin-bottom: 12px;
            transition: border 0.2s;
        }

        .manual-form input:focus {
            outline: none;
            border-color: #3498db;
        }

        .footer {
            background: #f8f9fa;
            padding: 16px;
            text-align: center;
            font-size: 11px;
            color: #6c757d;
            border-top: 1px solid #e9ecef;
        }

        @media (max-width: 480px) {
            .content {
                padding: 18px;
            }
            button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>
            <span>📶</span> WiFi Premium
        </h1>
        <p>Autenticación por QR o Voucher</p>
        <div class="badge-wifi">🎯 GWN7630LR | MikroTik Ready</div>
    </div>

    <div class="content">
        <div class="info-card">
            <p id="mainMessage">
                🔍 <span class="highlight">Escanea el QR</span> de tu ticket o ingresa manualmente el <span class="highlight">usuario y contraseña</span> del voucher.
            </p>
        </div>

        <!-- Área del escáner QR -->
        <div class="scanner-area">
            <div id="qr-reader"></div>
        </div>

        <!-- Botones de control -->
        <div class="button-group">
            <button id="startScannerBtn" class="btn-primary">
                📷 Iniciar Cámara
            </button>
            <button id="stopScannerBtn" class="btn-secondary" disabled>
                ⏹️ Detener
            </button>
        </div>

        <!-- Área de estado dinámico -->
        <div id="statusContainer" class="status-area"></div>

        <!-- Sección manual -->
        <div class="manual-section">
            <div class="manual-toggle">
                <a id="toggleManualBtn">✏️ ¿Problemas con la cámara? Ingresa tu voucher manualmente</a>
            </div>
            <div id="manualForm" class="manual-form">
                <input type="text" id="voucherUsername" placeholder="Usuario del voucher" autocomplete="off">
                <input type="password" id="voucherPassword" placeholder="Contraseña del voucher" autocomplete="off">
                <button id="submitVoucherBtn" class="btn-outline" style="width: 100%;">
                    ✅ Conectarse
                </button>
            </div>
        </div>
    </div>

    <div class="footer">
        🔒 Conexión segura · Soporte inmediato
    </div>
</div>

<!-- Panel de depuración (colapsable) -->
<div id="debugPanel" class="debug-panel collapsed">
    <span id="debugLog">📋 Log listo</span>
</div>

<script>
    // ==================== SISTEMA DE DEPURACIÓN ====================
    const debugLog = document.getElementById('debugLog');
    let debugMessages = [];

    function logToDebug(message, type = 'info') {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = `[${timestamp}] ${message}`;
        debugMessages.unshift(logEntry);
        if (debugMessages.length > 8) debugMessages.pop();
        debugLog.innerHTML = debugMessages.join('<br>');
        console.log(`[DEBUG ${type.toUpperCase()}]`, message);
        
        // Si el panel no está colapsado, mostrar bien
        const panel = document.getElementById('debugPanel');
        if (!panel.classList.contains('collapsed')) {
            debugLog.style.display = 'block';
        }
    }

    // Toggle panel depuración (click para expandir/colapsar)
    const debugPanel = document.getElementById('debugPanel');
    debugPanel.addEventListener('click', (e) => {
        e.stopPropagation();
        debugPanel.classList.toggle('collapsed');
        if (debugPanel.classList.contains('collapsed')) {
            debugLog.style.display = 'none';
        } else {
            debugLog.style.display = 'block';
        }
    });

    // ==================== VARIABLES GLOBALES ====================
    let html5QrScanner = null;
    let isScannerActive = false;
    let currentCameraId = null;

    // Elementos DOM
    const startBtn = document.getElementById('startScannerBtn');
    const stopBtn = document.getElementById('stopScannerBtn');
    const toggleManualBtn = document.getElementById('toggleManualBtn');
    const manualForm = document.getElementById('manualForm');
    const voucherUsername = document.getElementById('voucherUsername');
    const voucherPassword = document.getElementById('voucherPassword');
    const submitVoucherBtn = document.getElementById('submitVoucherBtn');
    const mainMessage = document.getElementById('mainMessage');
    const statusContainer = document.getElementById('statusContainer');

    // ==================== CAPTURA DATOS DEL AP (Grandstream/MikroTik) ====================
    const urlParams = new URLSearchParams(window.location.search);
    const apBaseUrl = urlParams.get('base_grant_url');
    const apGrantToken = urlParams.get('grant_token');

    // Guardar en localStorage
    if (apBaseUrl && apGrantToken) {
        localStorage.setItem('ap_wifi_url', apBaseUrl);
        localStorage.setItem('ap_wifi_token', apGrantToken);
        logToDebug(`✅ AP configurado: ${apBaseUrl}`, 'success');
        showStatusMessage('✅ Configuración de red guardada correctamente', 'success');
    } else {
        logToDebug('⚠️ No se recibieron parámetros del AP. Asegúrate de estar conectado al WiFi.', 'warning');
    }

    // Verificar si hay autenticación por URL (u y p)
    const urlUser = urlParams.get('u');
    const urlPass = urlParams.get('p');
    if (urlUser && urlPass) {
        logToDebug(`🔑 Voucher detectado en URL: ${urlUser}`, 'info');
        showStatusMessage('🔄 Voucher detectado automáticamente...', 'info');
        setTimeout(() => {
            authenticateVoucher(urlUser, urlPass);
        }, 500);
    }

    // ==================== FUNCIONES DE UI ====================
    function showStatusMessage(message, type = 'info') {
        const alertClass = {
            'info': 'alert-info',
            'success': 'alert-success',
            'warning': 'alert-warning',
            'error': 'alert-error'
        }[type] || 'alert-info';
        
        const icon = {
            'info': 'ℹ️',
            'success': '✅',
            'warning': '⚠️',
            'error': '❌'
        }[type] || '📢';
        
        statusContainer.innerHTML = `
            <div class="alert ${alertClass}">
                <span>${icon}</span>
                <span>${escapeHtml(message)}</span>
            </div>
        `;
        
        // Auto limpiar después de 5 segundos solo si no es error crítico
        if (type !== 'error') {
            setTimeout(() => {
                if (statusContainer.innerHTML.includes(message)) {
                    // Solo limpiar si sigue siendo el mismo mensaje
                }
            }, 5000);
        }
        logToDebug(message, type);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ==================== AUTENTICACIÓN PRINCIPAL ====================
    function authenticateVoucher(username, password) {
        const savedUrl = localStorage.getItem('ap_wifi_url');
        const savedToken = localStorage.getItem('ap_wifi_token');

        logToDebug(`Autenticando con usuario: ${username}`, 'info');

        if (!savedUrl || !savedToken) {
            const errorMsg = '❌ No se detecta red WiFi. Conéctate al WiFi del local primero.';
            showStatusMessage(errorMsg, 'error');
            mainMessage.innerHTML = '⚠️ <strong>Error:</strong> Debes estar conectado a la red WiFi del establecimiento.';
            logToDebug(errorMsg, 'error');
            return false;
        }

        // Mostrar estado de carga
        showStatusMessage('🔄 Validando credenciales con el servidor...', 'info');
        mainMessage.innerHTML = '⏳ <strong>Conectando...</strong> Por favor espera un momento.';
        
        // Construir URL de redirección
        let redirectUrl;
        if (savedUrl.includes('?')) {
            redirectUrl = `${savedUrl}&token=${encodeURIComponent(savedToken)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        } else {
            redirectUrl = `${savedUrl}?token=${encodeURIComponent(savedToken)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        }
        
        logToDebug(`Redirigiendo a: ${redirectUrl.substring(0, 100)}...`, 'info');
        
        // Pequeño delay para feedback visual
        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 1200);
        
        return true;
    }

    // ==================== ESCÁNER QR (COMPLETAMENTE DEPURADO) ====================
    async function initScanner() {
        if (isScannerActive) {
            showStatusMessage('El escáner ya está activo', 'warning');
            return;
        }

        try {
            showStatusMessage('📱 Solicitando acceso a la cámara...', 'info');
            logToDebug('Iniciando escáner QR...', 'info');
            
            // Crear instancia del lector
            html5QrScanner = new Html5Qrcode("qr-reader");
            
            // Obtener lista de cámaras
            const cameras = await Html5Qrcode.getCameras();
            
            if (!cameras || cameras.length === 0) {
                throw new Error('No se encontraron cámaras en este dispositivo');
            }
            
            logToDebug(`📸 Cámaras encontradas: ${cameras.length}`, 'info');
            
            // Seleccionar mejor cámara (trasera/environment)
            let selectedCamera = cameras[0];
            for (const cam of cameras) {
                const label = cam.label.toLowerCase();
                if (label.includes('back') || label.includes('environment') || label.includes('trasera') || label.includes('rear')) {
                    selectedCamera = cam;
                    logToDebug(`✅ Cámara trasera seleccionada: ${cam.label.substring(0, 50)}`, 'success');
                    break;
                }
            }
            
            currentCameraId = selectedCamera.id;
            
            // Configuración optimizada
            const config = {
                fps: 12,
                qrbox: { width: 280, height: 280 },
                aspectRatio: 1.0,
                disableFlip: false
            };
            
            await html5QrScanner.start(currentCameraId, config, onQRSuccess, onQRError);
            
            isScannerActive = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            showStatusMessage('📷 Escáner activado - Apunta al código QR de tu ticket', 'success');
            mainMessage.innerHTML = '🎯 <strong>Escáner activo:</strong> Enfoca el código QR de tu voucher.';
            logToDebug('Escáner funcionando correctamente', 'success');
            
        } catch (err) {
            logToDebug(`Error al iniciar escáner: ${err.message}`, 'error');
            showStatusMessage(`❌ Error: ${err.message}. Usa el modo manual.`, 'error');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            mainMessage.innerHTML = '⚠️ <strong>Cámara no disponible:</strong> Usa el formulario manual para ingresar tus datos.';
            
            // Mostrar panel manual automáticamente si hay error de cámara
            setTimeout(() => {
                manualForm.classList.add('show');
            }, 500);
        }
    }

    async function stopScanner() {
        if (html5QrScanner && isScannerActive) {
            try {
                await html5QrScanner.stop();
                isScannerActive = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                showStatusMessage('⏹️ Escáner detenido', 'info');
                mainMessage.innerHTML = '📱 Escanea el código QR de tu ticket o ingresa tus datos manualmente.';
                logToDebug('Escáner detenido correctamente', 'info');
            } catch (err) {
                logToDebug(`Error al detener: ${err.message}`, 'error');
            }
        }
    }

    function onQRSuccess(decodedText, decodedResult) {
        logToDebug(`📱 QR escaneado: ${decodedText.substring(0, 100)}`, 'success');
        
        // Detener escáner automáticamente
        stopScanner();
        
        // Parsear el contenido del QR
        let username = null;
        let password = null;
        
        try {
            // Método 1: Si es una URL con parámetros
            if (decodedText.includes('?')) {
                const urlObj = new URL(decodedText);
                username = urlObj.searchParams.get('u');
                password = urlObj.searchParams.get('p');
                logToDebug(`Parseado como URL: u=${username}, p=${password ? '***' : 'null'}`, 'info');
            }
            
            // Método 2: Si son parámetros directos tipo "u=admin&p=123"
            if ((!username || !password) && decodedText.includes('&') && decodedText.includes('=')) {
                const params = new URLSearchParams(decodedText);
                username = params.get('u');
                password = params.get('p');
                logToDebug(`Parseado como query string: u=${username}`, 'info');
            }
            
            // Método 3: Si el QR contiene solo texto plano con formato "usuario:contraseña" o "usuario,contraseña"
            if (!username || !password) {
                if (decodedText.includes(':')) {
                    const parts = decodedText.split(':');
                    username = parts[0];
                    password = parts[1];
                    logToDebug(`Parseado con formato ":"`, 'info');
                } else if (decodedText.includes(',')) {
                    const parts = decodedText.split(',');
                    username = parts[0];
                    password = parts[1];
                    logToDebug(`Parseado con formato ","`, 'info');
                }
            }
            
            if (username && password) {
                showStatusMessage('✅ Código QR válido. Autenticando...', 'success');
                mainMessage.innerHTML = '🔄 <strong>Voucher detectado</strong> Conectando con el servidor...';
                authenticateVoucher(username, password);
            } else {
                showStatusMessage('⚠️ El QR escaneado no contiene usuario/contraseña válidos', 'warning');
                mainMessage.innerHTML = '❌ <strong>QR inválido:</strong> El código debe contener usuario y contraseña del voucher.';
                logToDebug(`QR no contiene u/p válidos. Contenido: ${decodedText}`, 'warning');
            }
            
        } catch (e) {
            logToDebug(`Error parseando QR: ${e.message}`, 'error');
            showStatusMessage('❌ No se pudo interpretar el código QR. Usa el modo manual.', 'error');
        }
    }

    function onQRError(errorMessage) {
        // Solo mostrar errores críticos, ignorar los de frames sin QR
        if (errorMessage && (
            errorMessage.includes('Permission') || 
            errorMessage.includes('NotAllowedError') ||
            errorMessage.includes('NotFoundError')
        )) {
            logToDebug(`Error crítico de cámara: ${errorMessage}`, 'error');
            showStatusMessage('🔒 Permiso de cámara denegado o no disponible. Usa el acceso manual.', 'error');
            stopScanner();
        }
        // Los errores de "no QR found" se ignoran silenciosamente
    }

    // ==================== MODO MANUAL ====================
    function toggleManualMode() {
        manualForm.classList.toggle('show');
        if (manualForm.classList.contains('show')) {
            logToDebug('Modo manual activado', 'info');
            if (isScannerActive) {
                stopScanner();
            }
        } else {
            logToDebug('Modo manual oculto', 'info');
        }
    }

    function submitManualVoucher() {
        const user = voucherUsername.value.trim();
        const pass = voucherPassword.value.trim();
        
        if (!user || !pass) {
            showStatusMessage('✏️ Por favor ingresa usuario y contraseña del voucher', 'warning');
            logToDebug('Intento de autenticación manual sin datos', 'warning');
            return;
        }
        
        logToDebug(`Autenticación manual con usuario: ${user}`, 'info');
        showStatusMessage('🔍 Validando voucher manual...', 'info');
        authenticateVoucher(user, pass);
    }

    // ==================== EVENT LISTENERS ====================
    startBtn.addEventListener('click', initScanner);
    stopBtn.addEventListener('click', stopScanner);
    toggleManualBtn.addEventListener('click', toggleManualMode);
    submitVoucherBtn.addEventListener('click', submitManualVoucher);
    
    // Enter en inputs manuales
    voucherUsername.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') voucherPassword.focus();
    });
    voucherPassword.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitManualVoucher();
    });

    // ==================== LIMPIEZA AL SALIR ====================
    window.addEventListener('beforeunload', async () => {
        if (html5QrScanner && isScannerActive) {
            try {
                await html5QrScanner.stop();
            } catch (e) {
                console.log('Error al limpiar escáner:', e);
            }
        }
    });

    // Verificar soporte de cámara al inicio
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        logToDebug('⚠️ Este navegador no soporta acceso a cámara via WebRTC', 'warning');
        showStatusMessage('⚠️ Tu navegador no soporta escáner QR. Usa el modo manual.', 'warning');
        startBtn.disabled = true;
    } else {
        logToDebug('✅ WebRTC soportado, escáner disponible', 'success');
    }

    logToDebug('🚀 Sistema inicializado correctamente', 'success');
    console.log('%c WiFi Premium v3.0 - Sistema depurado y listo', 'color: #3498db; font-size: 14px; font-weight: bold;');
</script>
</body>
