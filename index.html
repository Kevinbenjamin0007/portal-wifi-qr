<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WiFi Premium | Acceso por QR</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
        }
        .header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .header h1 { font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .content { padding: 24px; }
        .scanner-area {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
            min-height: 300px;
            position: relative;
        }
        #qr-reader { width: 100%; }
        #qr-reader video { width: 100% !important; height: auto !important; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin: 8px 0;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover:not(:disabled) { background: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover:not(:disabled) { background: #545b62; }
        .btn-success { background: #28a745; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-box {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            text-align: center;
            font-size: 13px;
        }
        .success-box {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            text-align: center;
            font-size: 13px;
        }
        .manual-link { text-align: center; margin: 15px 0; }
        .manual-link a { color: #007bff; text-decoration: none; font-size: 14px; cursor: pointer; }
        .manual-form {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        .manual-form.show { display: block; }
        .manual-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 50px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .footer {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #888;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1><span>📶</span> WiFi Premium</h1>
        <p>Escanea el código QR de tu mesa</p>
    </div>

    <div class="content">
        <div id="statusMsg" class="success-box">
            📡 Conectado. Haz clic en "Iniciar Escáner"
        </div>

        <div class="scanner-area">
            <div id="qr-reader"></div>
        </div>

        <button class="btn btn-primary" id="startBtn">📷 Iniciar Escáner</button>
        <button class="btn btn-secondary" id="stopBtn" disabled>⏹️ Detener</button>

        <div class="manual-link">
            <a href="#" id="toggleManualBtn">✏️ ¿No funciona la cámara? Ingreso manual</a>
        </div>

        <div id="manualForm" class="manual-form">
            <input type="text" id="manualUser" placeholder="Usuario (ej: mesa01)">
            <input type="password" id="manualPass" placeholder="Contraseña (ej: 1234)">
            <button class="btn btn-success" id="submitManualBtn">Conectarse</button>
        </div>
    </div>

    <div class="footer">
        🔒 Sistema de autenticación por QR | Soporte 24/7
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#dc3545' : '#333';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
        console.log(msg);
    }

    function updateStatus(msg, isError = false) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.textContent = msg;
        statusDiv.className = isError ? 'error-box' : 'success-box';
    }

    // Verificar si estamos en HTTPS
    if (window.location.protocol !== 'https:') {
        updateStatus('⚠️ HTTPS requerido para la cámara. Usa https://', true);
        showToast('⚠️ La cámara requiere HTTPS', true);
    }

    // Capturar parámetros de MikroTik
    const urlParams = new URLSearchParams(window.location.search);
    const loginUrl = urlParams.get('link-login');
    const mac = urlParams.get('mac');
    
    if (loginUrl) {
        localStorage.setItem('mikrotik_login', loginUrl);
        localStorage.setItem('mikrotik_mac', mac);
        updateStatus('✅ Portal detectado. Escanea tu QR.');
        showToast('✅ Portal detectado');
    }

    // Autenticación
    function authenticate(username, password) {
        let loginBase = localStorage.getItem('mikrotik_login');
        if (!loginBase) loginBase = 'http://192.168.88.1/login';
        
        const redirectUrl = `${loginBase}?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        showToast(`✅ Conectando como ${username}...`);
        
        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 500);
    }

    // ==================== ESCÁNER QR MEJORADO ====================
    let scanner = null;
    let scanning = false;

    async function startScanner() {
        if (scanning) {
            showToast('⚠️ Escáner ya activo');
            return;
        }

        // Verificar soporte de cámara
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            updateStatus('❌ Tu navegador no soporta cámara. Usa el ingreso manual.', true);
            showToast('❌ Navegador no compatible con cámara', true);
            return;
        }

        updateStatus('📷 Solicitando permiso de cámara...');
        showToast('📷 Permite el acceso a la cámara');

        try {
            scanner = new Html5Qrcode("qr-reader");
            
            // Obtener cámaras disponibles
            const cameras = await Html5Qrcode.getCameras();
            
            if (!cameras || cameras.length === 0) {
                throw new Error('No se encontraron cámaras');
            }
            
            // Seleccionar cámara trasera si existe
            let cameraId = cameras[0].id;
            for (const cam of cameras) {
                if (cam.label.toLowerCase().includes('back') || 
                    cam.label.toLowerCase().includes('environment') ||
                    cam.label.toLowerCase().includes('trasera')) {
                    cameraId = cam.id;
                    break;
                }
            }
            
            updateStatus('📷 Escaneando... Apunta al QR');
            
            await scanner.start(
                cameraId,
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    console.log('✅ QR detectado:', decodedText);
                    stopScanner();
                    
                    let user = null, pass = null;
                    
                    // Extraer usuario y contraseña del QR
                    if (decodedText.includes('?')) {
                        const qrParams = new URLSearchParams(decodedText.split('?')[1]);
                        user = qrParams.get('u');
                        pass = qrParams.get('p');
                    } else if (decodedText.includes('&')) {
                        const qrParams = new URLSearchParams(decodedText);
                        user = qrParams.get('u');
                        pass = qrParams.get('p');
                    } else if (decodedText.includes(':')) {
                        const parts = decodedText.split(':');
                        user = parts[0];
                        pass = parts[1];
                    } else if (decodedText.includes(',')) {
                        const parts = decodedText.split(',');
                        user = parts[0];
                        pass = parts[1];
                    }
                    
                    if (user && pass) {
                        updateStatus(`✅ QR válido: ${user}`);
                        showToast(`✅ Conectando como ${user}`);
                        authenticate(user, pass);
                    } else {
                        updateStatus('❌ QR inválido - Formato incorrecto', true);
                        showToast('❌ QR debe contener u=usuario&p=clave', true);
                    }
                },
                (error) => {
                    // Solo mostrar errores importantes (no "no se encontró QR")
                    if (error && (error.includes('Permission') || error.includes('NotAllowed'))) {
                        updateStatus('❌ Permiso de cámara denegado', true);
                        showToast('❌ Permiso de cámara denegado', true);
                        stopScanner();
                    }
                }
            );
            
            scanning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
        } catch (err) {
            console.error('Error al iniciar escáner:', err);
            updateStatus(`❌ Error: ${err.message}. Usa el ingreso manual.`, true);
            showToast(`❌ Error de cámara: ${err.message}`, true);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }
    }

    async function stopScanner() {
        if (scanner && scanning) {
            try {
                await scanner.stop();
                scanning = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                updateStatus('📡 Escáner detenido');
                showToast('⏹️ Escáner detenido');
            } catch (err) {
                console.error('Error al detener:', err);
            }
        }
    }

    // ==================== MODO MANUAL ====================
    let manualVisible = false;
    document.getElementById('toggleManualBtn').onclick = () => {
        manualVisible = !manualVisible;
        document.getElementById('manualForm').classList.toggle('show', manualVisible);
        if (manualVisible && scanning) stopScanner();
    };

    document.getElementById('submitManualBtn').onclick = () => {
        const user = document.getElementById('manualUser').value.trim();
        const pass = document.getElementById('manualPass').value.trim();
        if (user && pass) authenticate(user, pass);
        else showToast('⚠️ Ingresa usuario y contraseña', true);
    };

    document.getElementById('startBtn').onclick = startScanner;
    document.getElementById('stopBtn').onclick = stopScanner;

    // Enter en inputs
    document.getElementById('manualUser').onkeypress = (e) => {
        if (e.key === 'Enter') document.getElementById('manualPass').focus();
    };
    document.getElementById('manualPass').onkeypress = (e) => {
        if (e.key === 'Enter') document.getElementById('submitManualBtn').click();
    };

    // Verificar si hay usuario en URL
    const urlUser = urlParams.get('u');
    const urlPass = urlParams.get('p');
    if (urlUser && urlPass) {
        showToast(`🔑 Autenticando ${urlUser}...`);
        setTimeout(() => authenticate(urlUser, urlPass), 1000);
    }

    showToast('🎯 Haz clic en "Iniciar Escáner"');
</script>
</body>
</html>
