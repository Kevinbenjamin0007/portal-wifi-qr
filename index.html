<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WiFi Premium | Autenticación por QR</title>
    <!-- Html5-QRCode Library -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 25px;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #555;
            line-height: 1.5;
            font-size: 14px;
        }

        .qr-container {
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        #qr-reader {
            width: 100%;
            border: none;
        }

        #qr-reader__dashboard_section_csr {
            padding: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 12px rgba(52,152,219,0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #7f8c8d;
        }

        .btn-outline {
            background: white;
            color: #3498db;
            border: 2px solid #3498db;
        }

        .btn-outline:hover {
            background: #3498db;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .manual-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .manual-link {
            text-align: center;
            font-size: 13px;
        }

        .manual-link a {
            color: #3498db;
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .manual-panel {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 12px;
            display: none;
        }

        .manual-panel.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .manual-panel input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .footer {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>🎯 WiFi de Cortesía</h1>
        <p>Acceso ultrarrápido • GWN7630LR & MikroTik</p>
    </div>

    <div class="content">
        <div class="info-box">
            <p id="messageText">📱 Escanea el código QR de tu ticket o voucher para navegar gratis.</p>
        </div>

        <!-- Área del escáner QR -->
        <div class="qr-container">
            <div id="qr-reader"></div>
        </div>

        <!-- Botones de control -->
        <div class="button-group">
            <button class="btn-primary" id="startBtn">
                📷 Iniciar escáner
            </button>
            <button class="btn-secondary" id="stopBtn" disabled>
                ⏹️ Detener
            </button>
        </div>

        <!-- Mensaje de estado -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Modo manual de respaldo -->
        <div class="manual-section">
            <div class="manual-link">
                🔑 <a id="showManualBtn">¿No puedes escanear? Ingresa tu voucher manualmente</a>
            </div>
            <div class="manual-panel" id="manualPanel">
                <input type="text" id="voucherUser" placeholder="Usuario del voucher" autocomplete="off">
                <input type="text" id="voucherPass" placeholder="Contraseña del voucher" autocomplete="off">
                <button class="btn-outline" id="submitManualBtn" style="width: 100%;">
                    ✅ Autenticar
                </button>
            </div>
        </div>
    </div>

    <div class="footer">
        🔒 Sistema seguro de autenticación por voucher | Soporte 24/7
    </div>
</div>

<script>
    // ==================== VARIABLES GLOBALES ====================
    let html5QrCode = null;
    let isScanning = false;

    // Elementos DOM
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const showManualBtn = document.getElementById('showManualBtn');
    const manualPanel = document.getElementById('manualPanel');
    const submitManualBtn = document.getElementById('submitManualBtn');
    const voucherUser = document.getElementById('voucherUser');
    const voucherPass = document.getElementById('voucherPass');
    const messageText = document.getElementById('messageText');
    const statusMessageDiv = document.getElementById('statusMessage');

    // ==================== CAPTURA DATOS DEL AP (Grandstream/MikroTik) ====================
    const params = new URLSearchParams(window.location.search);
    
    // 1. Capturar datos del AP (se ejecuta al conectar al Wi-Fi)
    const ap_url = params.get('base_grant_url');
    const ap_token = params.get('grant_token');
    
    if (ap_url && ap_token) {
        localStorage.setItem('ap_wifi_url', ap_url);
        localStorage.setItem('ap_wifi_token', ap_token);
        console.log('✅ Datos del AP guardados:', ap_url);
        showStatus('✅ Configuración de red detectada', 'success');
    }

    // 2. Capturar datos del Voucher por URL (parámetros u y p)
    const voucherUserParam = params.get('u');
    const voucherPassParam = params.get('p');
    
    if (voucherUserParam && voucherPassParam) {
        // Validar automáticamente el voucher si viene en la URL
        showStatus('🔄 Validando voucher automáticamente...', 'info');
        authenticateVoucher(voucherUserParam, voucherPassParam);
    }

    // ==================== FUNCIONES PRINCIPALES ====================
    
    // Función para mostrar mensajes de estado
    function showStatus(message, type = 'info') {
        statusMessageDiv.textContent = message;
        statusMessageDiv.className = `status-message show ${type}`;
        setTimeout(() => {
            if (statusMessageDiv.className.includes('show')) {
                statusMessageDiv.classList.remove('show');
            }
        }, 4000);
    }

    // Función para autenticar el voucher contra el Grandstream
    function authenticateVoucher(username, password) {
        const savedUrl = localStorage.getItem('ap_wifi_url');
        const savedToken = localStorage.getItem('ap_wifi_token');

        if (!savedUrl || !savedToken) {
            showStatus('❌ Error: Conéctate primero a la red WiFi del local', 'error');
            messageText.innerHTML = '⚠️ <strong>Error:</strong> Por favor, conectate a la red WiFi antes de escanear el QR.';
            return false;
        }

        // Mostrar loader en el botón si está disponible
        messageText.innerHTML = '🔄 <strong>Validando voucher...</strong> Conectando con el servidor...';
        showStatus('Validando credenciales...', 'info');

        // Construir URL de redirección con usuario y contraseña
        let redirectUrl = `${savedUrl}?token=${savedToken}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        
        // Si ya tiene parámetros, ajustar
        if (savedUrl.includes('?')) {
            redirectUrl = `${savedUrl}&token=${savedToken}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        }

        // Delay para feedback visual antes de redirigir
        setTimeout(() => {
            window.location.href = redirectUrl;
        }, 1500);
        
        return true;
    }

    // ==================== ESCÁNER QR ====================
    
    async function startScanner() {
        if (isScanning) {
            showStatus('El escáner ya está activo', 'info');
            return;
        }

        try {
            // Crear instancia del lector QR
            html5QrCode = new Html5Qrcode("qr-reader");
            
            // Obtener cámaras disponibles
            const devices = await Html5Qrcode.getCameras();
            
            if (!devices || devices.length === 0) {
                throw new Error('No se encontraron cámaras');
            }
            
            // Seleccionar cámara trasera si existe
            let cameraId = devices[0].id;
            const backCamera = devices.find(device => 
                device.label.toLowerCase().includes('back') || 
                device.label.toLowerCase().includes('environment') ||
                device.label.toLowerCase().includes('trasera')
            );
            
            if (backCamera) {
                cameraId = backCamera.id;
            }
            
            // Configuración del escáner
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };
            
            await html5QrCode.start(cameraId, config, onQRCodeSuccess, onQRCodeError);
            isScanning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            showStatus('📷 Escáner activado - Apunta al código QR de tu ticket', 'success');
            messageText.innerHTML = '📸 <strong>Escáner activo:</strong> Enfoca el código QR que está en tu ticket o voucher.';
            
        } catch (err) {
            console.error('Error al iniciar escáner:', err);
            showStatus('❌ No se pudo acceder a la cámara. Usa el acceso manual.', 'error');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            messageText.innerHTML = '⚠️ <strong>No se detectó cámara:</strong> Usa el enlace "Ingresa tu voucher manualmente" para conectarte.';
        }
    }

    async function stopScanner() {
        if (html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
                isScanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                showStatus('⏹️ Escáner detenido', 'info');
                messageText.innerHTML = '📱 Escanea el código QR de tu ticket o voucher para navegar gratis.';
            } catch (err) {
                console.error('Error al detener escáner:', err);
            }
        }
    }

    // Callback cuando se escanea un QR exitosamente
    function onQRCodeSuccess(decodedText, decodedResult) {
        console.log('✅ QR escaneado:', decodedText);
        
        // Detener el escáner
        stopScanner();
        
        // Intentar parsear el QR como parámetros u=xxx&p=yyy
        try {
            // El QR puede contener una URL o directamente parámetros
            let username = null;
            let password = null;
            
            // Si es una URL, extraer parámetros
            if (decodedText.includes('?')) {
                const qrParams = new URLSearchParams(decodedText.split('?')[1]);
                username = qrParams.get('u');
                password = qrParams.get('p');
            } else if (decodedText.includes('&')) {
                // Si son parámetros directos como "u=admin&p=12345"
                const qrParams = new URLSearchParams(decodedText);
                username = qrParams.get('u');
                password = qrParams.get('p');
            }
            
            // Si encontramos usuario y contraseña en el QR
            if (username && password) {
                showStatus('✅ Voucher detectado. Autenticando...', 'success');
                messageText.innerHTML = '🔄 <strong>Voucher válido:</strong> Conectando con el servidor...';
                authenticateVoucher(username, password);
            } else {
                // Si el QR solo contiene texto, intentar usarlo como token alternativo
                showStatus('⚠️ QR inválido - Debe contener usuario y contraseña del voucher', 'error');
                messageText.innerHTML = '❌ <strong>QR inválido:</strong> El código debe contener los datos de acceso. Usa el acceso manual.';
            }
        } catch (e) {
            console.error('Error al parsear QR:', e);
            showStatus('❌ QR no reconocido - Escanea el código correcto de tu ticket', 'error');
        }
    }

    function onQRCodeError(errorMessage) {
        // Errores menores se ignoran para no molestar al usuario
        if (errorMessage.includes('Permission') || errorMessage.includes('NotAllowedError')) {
            showStatus('🔒 Permiso de cámara denegado. Usa el acceso manual.', 'error');
            stopScanner();
        }
    }

    // ==================== MODO MANUAL ====================
    
    function showManualPanel() {
        manualPanel.classList.toggle('show');
        if (manualPanel.classList.contains('show')) {
            if (isScanning) {
                stopScanner();
            }
            voucherUser.focus();
        }
    }

    function submitManualVoucher() {
        const username = voucherUser.value.trim();
        const password = voucherPass.value.trim();
        
        if (!username || !password) {
            showStatus('✏️ Por favor, ingresa usuario y contraseña del voucher', 'error');
            return;
        }
        
        showStatus('🔍 Validando voucher manual...', 'info');
        authenticateVoucher(username, password);
    }

    // ==================== EVENT LISTENERS ====================
    startBtn.addEventListener('click', startScanner);
    stopBtn.addEventListener('click', stopScanner);
    showManualBtn.addEventListener('click', showManualPanel);
    submitManualBtn.addEventListener('click', submitManualVoucher);
    
    // Enter en inputs manuales
    voucherUser.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') voucherPass.focus();
    });
    voucherPass.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitManualVoucher();
    });

    // ==================== LIMPIEZA ====================
    window.addEventListener('beforeunload', () => {
        if (html5QrCode && isScanning) {
            html5QrCode.stop().catch(console.log);
        }
    });

    console.log('✅ Sistema listo - Modos: Escaneo QR y Voucher Manual');
</script>
</body>
</html>
